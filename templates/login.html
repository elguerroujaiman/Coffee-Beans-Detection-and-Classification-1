<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeBean Classifier | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <a href="/login" class="nav-logo">
            <img src="{{ url_for('static', filename='coffee-bean-icon.svg') }}" alt="Coffee bean logo" class="brand-bean-icon">
            <span>CB Classifier</span>
        </a>
        <div class="nav-links">
            <a href="/signup"><i class="fas fa-user-plus"></i> Sign Up</a>
        </div>
    </nav>

    <main class="auth-shell">
        <section class="auth-card">
            <h1 class="auth-title">Login</h1>
            <p class="auth-subtitle">Access your quality-control workspace.</p>

            {% if created %}
            <div class="auth-success">Account created successfully. Please log in.</div>
            {% endif %}

            {% if error %}
            <div class="auth-alert">{{ error }}</div>
            {% endif %}

            <form id="login-form" method="POST" action="/login" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_path }}">
                <input type="hidden" name="username" id="login-username-hidden">
                <input type="hidden" name="password" id="login-password-hidden">
                <div class="auth-field">
                    <label for="login-username-ui">Username</label>
                    <input id="login-username-ui" name="login_username_ui" type="text" required autocomplete="off"
                        autocapitalize="off" autocorrect="off" spellcheck="false" readonly>
                </div>

                <div class="auth-field">
                    <label for="login-password-ui">Password</label>
                    <input id="login-password-ui" name="login_password_ui" type="password" required
                        autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                        readonly>
                </div>

                <label class="auth-check">
                    <input type="checkbox" name="remember_me">
                    Remember me for 10 days
                </label>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-right-to-bracket"></i> Login
                </button>
            </form>

            <p class="auth-switch">
                New here? <a href="/signup">Create an account</a>
            </p>
        </section>
    </main>
    <script>
        (function () {
            const form = document.getElementById('login-form');
            const userUi = document.getElementById('login-username-ui');
            const passUi = document.getElementById('login-password-ui');
            const userHidden = document.getElementById('login-username-hidden');
            const passHidden = document.getElementById('login-password-hidden');

            function unlock(el) {
                if (el) el.removeAttribute('readonly');
            }

            [userUi, passUi].forEach((el) => {
                if (!el) return;
                el.addEventListener('focus', () => unlock(el), { once: true });
                el.addEventListener('pointerdown', () => unlock(el), { once: true });
            });

            if (form) {
                form.addEventListener('submit', () => {
                    userHidden.value = (userUi.value || '').trim();
                    passHidden.value = passUi.value || '';
                });
            }
        })();
    </script>
</body>

</html>
