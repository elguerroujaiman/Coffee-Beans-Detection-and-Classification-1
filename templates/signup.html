<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeBean Classifier | Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <a href="/login" class="nav-logo">
            <img src="{{ url_for('static', filename='coffee-bean-icon.svg') }}" alt="Coffee bean logo" class="brand-bean-icon">
            <span>CB Classifier</span>
        </a>
        <div class="nav-links">
            <a href="/login"><i class="fas fa-right-to-bracket"></i> Login</a>
        </div>
    </nav>

    <main class="auth-shell">
        <section class="auth-card">
            <h1 class="auth-title">Sign Up</h1>
            <p class="auth-subtitle">Create your local account to use the app.</p>

            {% if error %}
            <div class="auth-alert">{{ error }}</div>
            {% endif %}

            <form id="signup-form" method="POST" action="/signup" autocomplete="off">
                <input type="hidden" name="username" id="signup-username-hidden">
                <input type="hidden" name="password" id="signup-password-hidden">
                <input type="hidden" name="confirm_password" id="signup-confirm-hidden">
                <div class="auth-field">
                    <label for="signup-username-ui">Username</label>
                    <input id="signup-username-ui" name="signup_username_ui" type="text" required autocomplete="off"
                        autocapitalize="off" autocorrect="off" spellcheck="false" readonly>
                </div>

                <div class="auth-field">
                    <label for="signup-password-ui">Password</label>
                    <input id="signup-password-ui" name="signup_password_ui" type="password" required
                        autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                        readonly>
                </div>

                <div class="auth-field">
                    <label for="signup-confirm-ui">Confirm Password</label>
                    <input id="signup-confirm-ui" name="signup_confirm_ui" type="password" required
                        autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                        readonly>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/login">Log in</a>
            </p>
        </section>
    </main>
    <script>
        (function () {
            const form = document.getElementById('signup-form');
            const userUi = document.getElementById('signup-username-ui');
            const passUi = document.getElementById('signup-password-ui');
            const confirmUi = document.getElementById('signup-confirm-ui');
            const userHidden = document.getElementById('signup-username-hidden');
            const passHidden = document.getElementById('signup-password-hidden');
            const confirmHidden = document.getElementById('signup-confirm-hidden');

            function unlock(el) {
                if (el) el.removeAttribute('readonly');
            }

            [userUi, passUi, confirmUi].forEach((el) => {
                if (!el) return;
                el.addEventListener('focus', () => unlock(el), { once: true });
                el.addEventListener('pointerdown', () => unlock(el), { once: true });
            });

            if (form) {
                form.addEventListener('submit', () => {
                    userHidden.value = (userUi.value || '').trim();
                    passHidden.value = passUi.value || '';
                    confirmHidden.value = confirmUi.value || '';
                });
            }
        })();
    </script>
</body>

</html>
