<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Detection Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .image-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 5px;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        .upload-area {
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background-color: #f8f9fa;
            border-color: #007bff;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">☕ Coffee Bean Quality Control</span>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">🏠 Dashboard</a>
                <a href="/history" class="btn btn-outline-light btn-sm">📜 History</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-lg">
                    <div class="card-header bg-dark text-white">
                        <h4>🖼️ Image Detection Test</h4>
                        <small>Upload an image to test bean detection (results not saved)</small>
                    </div>
                    <div class="card-body">
                        <!-- Upload Section -->
                        <div class="mb-4">
                            <label for="imageInput" class="form-label fw-bold">Upload Image</label>
                            <input type="file" class="form-control" id="imageInput" accept="image/*">
                            <button class="btn btn-primary mt-2" onclick="detectImage()">
                                🔍 Detect Beans
                            </button>
                        </div>

                        <!-- Results Section -->
                        <div class="row">
                            <!-- Original Image -->
                            <div class="col-md-6">
                                <h5 class="text-center mb-3">Original Image</h5>
                                <div class="image-container" id="originalContainer">
                                    <p class="text-muted">No image uploaded</p>
                                </div>
                            </div>

                            <!-- Detected Image -->
                            <div class="col-md-6">
                                <h5 class="text-center mb-3">Detection Result</h5>
                                <div class="image-container" id="detectedContainer">
                                    <p class="text-muted">Upload an image to see results</p>
                                </div>
                            </div>
                        </div>

                        <!-- Stats -->
                        <div class="row mt-4" id="statsSection" style="display: none;">
                            <div class="col-md-4">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h6>Good Beans</h6>
                                        <h3 id="goodCount">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-danger text-white">
                                    <div class="card-body text-center">
                                        <h6>Bad Beans</h6>
                                        <h3 id="badCount">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h6>Total Detected</h6>
                                        <h3 id="totalCount">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function detectImage() {
            const input = document.getElementById('imageInput');
            const file = input.files[0];

            if (!file) {
                alert('Please select an image first');
                return;
            }

            // Show loading spinners
            document.getElementById('originalContainer').innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>';
            document.getElementById('detectedContainer').innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Processing...</span></div>';
            document.getElementById('statsSection').style.display = 'none';

            // Prepare form data
            const formData = new FormData();
            formData.append('image', file);

            // Send to server
            fetch('/detect_image', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Error: ' + data.error);
                        return;
                    }

                    // Show original image
                    document.getElementById('originalContainer').innerHTML = `<img src="${data.original}" alt="Original">`;

                    // Show detected image
                    document.getElementById('detectedContainer').innerHTML = `<img src="${data.detected}" alt="Detected">`;

                    // Show stats
                    document.getElementById('goodCount').textContent = data.good_count;
                    document.getElementById('badCount').textContent = data.bad_count;
                    document.getElementById('totalCount').textContent = data.total;
                    document.getElementById('statsSection').style.display = 'flex';
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to process image');
                });
        }

        // Preview on file select
        document.getElementById('imageInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    document.getElementById('originalContainer').innerHTML = `<img src="${event.target.result}" alt="Preview">`;
                    document.getElementById('detectedContainer').innerHTML = '<p class="text-muted">Click "Detect Beans" to process</p>';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
